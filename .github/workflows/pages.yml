# Publishes web/static (the existing dashboard) to GitHub Pages.
# The page reads reports/dashboard.json from the state branch; this workflow
# does not redeploy on every scan.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
