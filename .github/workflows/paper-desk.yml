# Paper-only Solana memecoin desk. No secrets, no wallet, no live orders.
# Each run stays up for about 5h45m, then dispatches the next run on main.
# The */30 cron is only a backup. Concurrency keeps one runner and at most
# one waiter. Repository variable DESK_ENABLED=false stops new runs and the chain.
name: Paper desk

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: paper-desk
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  relay:
    name: paper relay
    if: vars.DESK_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relay loop
        env:
          DESK_PUSH_STATE: "1"
          DESK_MANAGE_SEC: "50"
          DESK_SCAN_SEC: "180"
          DESK_MAX_SECONDS: "20700"
        run: ./scheduler.sh ci-loop

      - name: Persist state before exit
        if: always()
        env:
          DESK_PUSH_STATE: "1"
        run: ./scheduler.sh commit-state

      - name: Chain the next relay
        if: always() && vars.DESK_ENABLED != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_ENABLED: ${{ vars.DESK_ENABLED }}
        run: |
          set -u
          enabled="$(printf '%s' "${DESK_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$enabled" = "false" ]; then
            echo "DESK_ENABLED=false; not starting another run"
            exit 0
          fi
          # Live read, so turning the variable off during this shift stops the chain.
          if live="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/DESK_ENABLED" --jq .value 2>/dev/null)"; then
            live="$(printf '%s' "$live" | tr '[:upper:]' '[:lower:]')"
            if [ "$live" = "false" ]; then
              echo "DESK_ENABLED=false; not starting another run"
              exit 0
            fi
          fi
          current="${GITHUB_RUN_ID}"
          others=0
          if ! others="$(gh run list --workflow paper-desk.yml --limit 30 --json databaseId,status \
            --jq "[.[] | select((.databaseId | tostring) != \"${current}\" and .status != \"completed\")] | length")"; then
            echo "could not list runs; dispatching anyway so concurrency can keep a single waiter"
            others=0
          fi
          if [ "${others}" != "0" ]; then
            echo "another paper-desk run is already queued or running (${others}); not dispatching a duplicate"
            exit 0
          fi
          gh workflow run paper-desk.yml --ref main
          echo "dispatched the next paper-desk run on main"
