# Paper-only copy desk. No wallets, no signing, no live orders.
# Separate concurrency group from the main desk. State pushes only replace
# data/copy.db and reports/copy_dashboard.json, on top of the latest state branch.
name: Copy desk

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: copy-desk
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  relay:
    name: copy relay
    if: vars.COPY_DESK_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore copy ledger
        run: ./scheduler.sh restore-copy

      - name: Listen and paper-copy
        env:
          COPY_PUSH_STATE: "1"
          COPY_MAX_SECONDS: "20700"
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python3 copy/run.py listen

      - name: Persist copy state before exit
        if: always()
        env:
          COPY_PUSH_STATE: "1"
        run: ./scheduler.sh publish-copy

      - name: Chain the next copy relay
        if: always() && vars.COPY_DESK_ENABLED != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPY_DESK_ENABLED: ${{ vars.COPY_DESK_ENABLED }}
        run: |
          set -u
          enabled="$(printf '%s' "${COPY_DESK_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$enabled" = "false" ]; then
            echo "COPY_DESK_ENABLED=false; not starting another run"
            exit 0
          fi
          if live="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/COPY_DESK_ENABLED" --jq .value 2>/dev/null)"; then
            live="$(printf '%s' "$live" | tr '[:upper:]' '[:lower:]')"
            if [ "$live" = "false" ]; then
              echo "COPY_DESK_ENABLED=false; not starting another run"
              exit 0
            fi
          fi
          current="${GITHUB_RUN_ID}"
          others=0
          if ! others="$(gh run list --workflow copy-desk.yml --limit 30 --json databaseId,status \
            --jq "[.[] | select((.databaseId | tostring) != \"${current}\" and .status != \"completed\")] | length")"; then
            echo "could not list copy runs; dispatching anyway so concurrency keeps a single waiter"
            others=0
          fi
          if [ "${others}" != "0" ]; then
            echo "another copy-desk run is already queued or running (${others}); not dispatching a duplicate"
            exit 0
          fi
          gh workflow run copy-desk.yml --ref main
          echo "dispatched the next copy-desk run on main"
