# Offline checks, the temp-database end-to-end mock, and one real paper tick.
# The tick uses the seed database in the runner only. It does not push state.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: paper desk tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fast-path and free-source tests
        run: |
          python3 tests/test_manage_fastpath.py
          python3 tests/test_free_sources.py
          python3 tests/test_entry_risk.py
          python3 tests/test_x_watchlist.py

      - name: Copy desk mock end to end
        run: python3 tests/test_copy_desk.py

      - name: Dip desk tests
        run: python3 tests/test_dip_desk.py

      - name: End-to-end mock (temp database)
        run: python3 tests/e2e_mock.py

      - name: One paper tick (not pushed)
        run: python3 run.py tick

      - name: One dip tick (not pushed)
        run: python3 dip/run.py tick
